name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run validate

  package-smoke:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Pack and install into a clean project
        shell: bash
        run: |
          set -euo pipefail
          PACK_FILE="$(npm pack --silent)"
          EXPECTED_VERSION="$(node -p "require('$GITHUB_WORKSPACE/package.json').version")"
          mkdir -p /tmp/game-dev-resource-mcp-smoke
          cd /tmp/game-dev-resource-mcp-smoke
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE/$PACK_FILE"
          ACTUAL_VERSION="$(node -p "require('./node_modules/game-dev-resource-mcp/package.json').version")"
          if [ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "Installed version $ACTUAL_VERSION does not match expected $EXPECTED_VERSION"
            exit 1
          fi
          set +e
          timeout 2s ./node_modules/.bin/game-dev-resource-mcp </dev/null
          CODE=$?
          set -e
          if [ "$CODE" -ne 0 ] && [ "$CODE" -ne 124 ]; then
            echo "MCP binary failed smoke start with exit code $CODE"
            exit "$CODE"
          fi

  git-source-smoke:
    runs-on: ubuntu-latest
    needs: validate
    env:
      SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install directly from GitHub source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/game-dev-resource-mcp-git-source
          cd /tmp/game-dev-resource-mcp-git-source
          npm init -y >/dev/null
          npm install "github:${SOURCE_REPOSITORY}#${SOURCE_SHA}"
          test -x ./node_modules/.bin/game-dev-resource-mcp
          set +e
          timeout 2s ./node_modules/.bin/game-dev-resource-mcp </dev/null
          CODE=$?
          set -e
          if [ "$CODE" -ne 0 ] && [ "$CODE" -ne 124 ]; then
            echo "GitHub-source MCP binary failed smoke start with exit code $CODE"
            exit "$CODE"
          fi
