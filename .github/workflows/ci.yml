name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run validate

  package-smoke:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Pack and install into a clean project
        shell: bash
        run: |
          set -euo pipefail
          PACK_FILE="$(npm pack --silent)"
          mkdir -p /tmp/game-dev-resource-mcp-smoke
          cd /tmp/game-dev-resource-mcp-smoke
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE/$PACK_FILE"
          node -e "const p=require('./node_modules/game-dev-resource-mcp/package.json'); if(p.version!=='1.0.0') { console.error(p.version); process.exit(1) }"
          set +e
          timeout 2s ./node_modules/.bin/game-dev-resource-mcp </dev/null
          CODE=$?
          set -e
          if [ "$CODE" -ne 0 ] && [ "$CODE" -ne 124 ]; then
            echo "MCP binary failed smoke start with exit code $CODE"
            exit "$CODE"
          fi
