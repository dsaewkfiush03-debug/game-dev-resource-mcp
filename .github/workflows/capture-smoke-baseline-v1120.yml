name: Capture live coverage smoke baseline v1.12

on:
  push:
    branches: [agent/benchmark-driven-expansion-v1120]
  pull_request:

permissions:
  contents: write

jobs:
  benchmark:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/benchmark-driven-expansion-v1120
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Capture benchmark summary
        shell: bash
        run: |
          npx tsx -e 'import { writeFileSync } from "node:fs"; import { runCoverageBenchmark } from "./src/coverage.ts"; const r = await runCoverageBenchmark({ suite: "smoke", perSlotLimit: 3, concurrency: 1 }); writeFileSync("coverage-baseline-v1120.json", JSON.stringify({generatedAt:r.generatedAt,scenarioCount:r.scenarioCount,requiredSlots:r.requiredSlots,coveredRequiredSlots:r.coveredRequiredSlots,requiredSlotCoveragePercent:r.requiredSlotCoveragePercent,depth3RequiredSlots:r.depth3RequiredSlots,depth3CoveragePercent:r.depth3CoveragePercent,completeScenarios:r.completeScenarios,completeScenarioPercent:r.completeScenarioPercent,unsupportedRequiredSlots:r.unsupportedRequiredSlots,providerErrorCount:r.providerErrorCount,weakSlots:r.weakSlots,groupMetrics:r.groupMetrics,scenarios:r.scenarios.map(s=>({id:s.id,group:s.group,coveragePercent:s.coveragePercent,depth3Percent:s.depth3Percent,gaps:s.gaps,weakSlots:s.weakSlots,providerErrorCount:s.providerErrorCount}))}, null, 2)); console.log("COVERAGE_SUMMARY=" + JSON.stringify({requiredSlotCoveragePercent:r.requiredSlotCoveragePercent,depth3CoveragePercent:r.depth3CoveragePercent,completeScenarioPercent:r.completeScenarioPercent,unsupportedRequiredSlots:r.unsupportedRequiredSlots,providerErrorCount:r.providerErrorCount,weakSlots:r.weakSlots,groupMetrics:r.groupMetrics}));'
      - name: Commit summary and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- coverage-baseline-v1120.json
          git rm .github/workflows/capture-smoke-baseline-v1120.yml
          git commit -m "Capture temporary v1.12 coverage baseline"
          git push origin HEAD:agent/benchmark-driven-expansion-v1120
