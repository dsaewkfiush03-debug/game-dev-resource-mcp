name: Finalize v1.16 search-quality release

on:
  push:
    branches: [agent/search-quality-v1160]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/search-quality-v1160
      - name: Update README, release notes and agent rules
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          readme = Path('README.md')
          text = readme.read_text()
          text = text.replace(
              'License-aware game-development resource discovery with **semantic query fallback, coverage benchmarking, reusable project selection and adoption planning**, stack recommendation and safe asset installation for AI coding agents via Model Context Protocol (MCP).',
              'A license-aware **game-development resource search engine** for AI coding agents, with semantic query planning, relevance ranking, provider routing, reusable-project discovery and safe license-aware acquisition via Model Context Protocol (MCP).',
              1
          )
          old = '- Expand game-development concepts such as turret/cannon/artillery/tank through bounded semantic fallback while preserving explicit hard filters.\n'
          new = '''- Expand game-development concepts through bounded semantic fallback while preserving explicit hard filters.\n- Diversify fallback across subjects/themes/styles instead of spending the whole query budget on one synonym family.\n- Prefer resources that cover several requested concepts (for example turret + enemy + cyberpunk + low-poly) over broad one-concept matches.\n'''
          if old in text:
              text = text.replace(old, new, 1)
          readme.write_text(text)

          notes = Path('RELEASE_NOTES.md')
          current = notes.read_text()
          section = '''## v1.16.0\n\nV1.16 keeps GameDev Resource MCP focused as a game-development resource search engine. It improves the quality of the first few results instead of adding an engine adaptation layer or more providers.\n\n### Broader game-development vocabulary\n\n- Adds maintained concepts for buildings, roads, loot/pickups, spaceships, cyberpunk, sci-fi, fantasy, medieval, post-apocalyptic, urban, nature and dungeon searches.\n- Concepts are classified as subjects, modifiers or systems so query planning can use their roles instead of treating every word equally.\n- The vocabulary remains bounded and deterministic; new mappings should be driven by real search failures or clear game-development usage.\n\n### Diverse semantic fallback\n\n- A high-priority concept can no longer consume nearly the entire fallback budget with its own synonyms.\n- Detected concepts receive a focused query before deeper round-robin synonym expansion.\n- Subject + modifier combinations such as `low poly turret`, `cyberpunk environment` and `medieval building` are generated before drifting to overly broad terms.\n- Explicit dimension, engine-specific-code, commercial-use, attribution/share-alike, provider and reuse-scope constraints remain hard filters.\n\n### Multi-concept relevance ranking\n\n- Semantic matches now receive a small priority-aware boost.\n- Direct matches to the user's triggering concept receive more weight than loose synonym-only matches.\n- Results covering several detected concepts receive a bounded concept-coverage bonus.\n- License/provenance/popularity/freshness signals remain secondary; an unrelated but permissively licensed pack cannot outrank a substantially more relevant result merely because its metadata is cleaner.\n\n### Quality-aware fallback stopping\n\n- Multi-concept searches no longer stop just because a few weak one-concept results accumulated.\n- The top result must meet a small semantic-coverage target before bounded fallback stops early.\n- Search diagnostics now expose `topSemanticCoverage` and `qualityTargetMet` for each attempted query.\n\n### Real search regressions\n\nThe deterministic suite now protects practical ranking behavior:\n\n- UrhoX + 3D + `tower defense turret gun enemy low poly` must recover generic 3D art without 2D substitution.\n- `cyberpunk turret enemy 3D low poly` must rank Quaternius Cyberpunk Game Kit first.\n- `medieval village building 3D low poly` must rank Medieval Village MegaKit first.\n- query planning must distribute fallback across turret/weapon/enemy/style/theme concepts and generate focused modifier+subject variants.\n\n### Product boundary\n\nV1.16 deliberately does not add model conversion, engine import automation or an engine compatibility platform. The coding agent remains responsible for integrating selected resources into the user's project.\n\n### Release engineering\n\n- package/runtime/lockfile version: `1.16.0`;\n- package description now explicitly positions the project as a game-development resource search engine;\n- Node 20/22 validation, npm tarball clean-install and MCP binary smoke start remain required.\n\n---\n\n\n'''
          if not current.startswith('# Release notes\n\n## v1.16.0'):
              current = current.replace('# Release notes\n\n', '# Release notes\n\n' + section, 1)
          notes.write_text(current)

          agents = Path('AGENTS.md')
          a = agents.read_text()
          needle = '22. Use provider capability metadata to avoid querying providers that cannot satisfy an explicit dimension/engine constraint. Provider pruning is an efficiency mechanism, not license evidence.\n'
          replacement = needle + '23. After license eligibility is enforced, semantic/query relevance must outrank popularity, freshness or other metadata bonuses. Do not use permissive licensing as a relevance substitute.\n24. Bounded semantic fallback should distribute query budget across detected game-development concepts before deeply expanding one synonym family; preserve the original query and hard filters.\n25. Candidate-count/depth benchmarks are not evidence of search relevance. Protect real query/ranking regressions separately.\n'
          if needle in a and 'Candidate-count/depth benchmarks are not evidence of search relevance.' not in a:
              a = a.replace(needle, replacement, 1)
              a = a.replace('23. Automatic downloads require', '26. Automatic downloads require', 1)
              a = a.replace('24. Never automatically execute', '27. Never automatically execute', 1)
              a = a.replace('25. Never guess a download URL', '28. Never guess a download URL', 1)
              a = a.replace('26. Local installation must remain', '29. Local installation must remain', 1)
          agents.write_text(a)
          PY
      - name: Commit and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md RELEASE_NOTES.md AGENTS.md
          git rm .github/workflows/finalize-v1160.yml
          git commit -m "Finalize v1.16 search-quality release files"
          git push origin HEAD:agent/search-quality-v1160
