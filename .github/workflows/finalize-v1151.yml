name: Finalize v1.15.1 lockfile

on:
  push:
    branches: [agent/relevance-hotfix-v1151]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/relevance-hotfix-v1151
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/finalize-v1151.yml
          git commit -m "Refresh v1.15.1 lockfile"
          git push origin HEAD:agent/relevance-hotfix-v1151
