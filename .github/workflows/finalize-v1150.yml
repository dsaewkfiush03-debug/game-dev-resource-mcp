name: Finalize v1.15 release files

on:
  push:
    branches: [agent/search-quality-v1150]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/search-quality-v1150
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh npm lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Update documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          readme = Path('README.md')
          text = readme.read_text()
          text = text.replace(
            'License-aware game-development resource discovery, **coverage benchmarking, reusable project selection and adoption planning**, stack recommendation and safe asset installation for AI coding agents via Model Context Protocol (MCP).',
            'License-aware game-development resource discovery with **semantic query fallback, coverage benchmarking, reusable project selection and adoption planning**, stack recommendation and safe asset installation for AI coding agents via Model Context Protocol (MCP).',
            1
          )
          needle = '- Search multiple game-resource providers with one query.\n'
          replacement = '''- Search multiple game-resource providers with one query.\n- Expand game-development concepts such as turret/cannon/artillery/tank through bounded semantic fallback while preserving explicit hard filters.\n- Return search diagnostics (attempted queries, fallback level, provider pruning and suggested alternative queries) instead of an opaque zero-result response.\n- Expose provider capability metadata so agents can see which sources cover 2D/3D/audio/font/code and engine-specific ecosystems.\n'''
          if needle in text and 'bounded semantic fallback' not in text:
              text = text.replace(needle, replacement, 1)
          docs_old = 'See [`docs/project-reuse.md`](docs/project-reuse.md), [`docs/project-adoption.md`](docs/project-adoption.md), [`docs/community-starters.md`](docs/community-starters.md), [`docs/coverage-benchmark.md`](docs/coverage-benchmark.md) and [`docs/end-to-end-example.md`](docs/end-to-end-example.md).'
          docs_new = 'See [`docs/search-quality.md`](docs/search-quality.md), [`docs/project-reuse.md`](docs/project-reuse.md), [`docs/project-adoption.md`](docs/project-adoption.md), [`docs/community-starters.md`](docs/community-starters.md), [`docs/coverage-benchmark.md`](docs/coverage-benchmark.md) and [`docs/end-to-end-example.md`](docs/end-to-end-example.md).'
          if docs_old in text:
              text = text.replace(docs_old, docs_new, 1)
          recommend_old = 'The planner does **not** invent license rights. Every slot is resolved through provider metadata and the same conservative license filters used by direct search. If a requested engine has no verified starter provider, the starter slot remains unresolved instead of silently substituting another engine.'
          recommend_new = '''The planner does **not** invent license rights. Every slot is resolved through provider metadata and the same conservative license filters used by direct search. If a requested engine has no verified starter provider, the starter slot remains unresolved instead of silently substituting another engine.\n\nV1.15 recognizes UrhoX/Urho3D/TapMaker, LÖVE/Love2D and Defold as explicit engine intents for code discovery. These engines do not automatically gain a verified starter catalog; GitHub discoveries remain `code-only / needs-review`.\n\nThe MCP-facing tool defaults to `responseMode = summary` so a normal recommendation does not dump tens of kilobytes of raw metadata into an agent context. Use `responseMode = full` when detailed per-asset provenance/ranking fields are required.'''
          if recommend_old in text:
              text = text.replace(recommend_old, recommend_new, 1)
          benchmark_old = 'Benchmark scores never override or relax license rules.'
          benchmark_new = 'Benchmark scores never override or relax license rules, and depth alone does not prove semantic relevance or engine compatibility.'
          if benchmark_old in text:
              text = text.replace(benchmark_old, benchmark_new, 1)
          readme.write_text(text)

          notes = Path('RELEASE_NOTES.md')
          current = notes.read_text()
          section = '''## v1.15.0\n\nV1.15 is driven by a completed real-game acceptance test that exposed a gap between catalog size and practical retrieval quality. A 3D low-poly tower-defense project using UrhoX/TapMaker received zero exact asset results and irrelevant stack suggestions despite broad provider coverage. This release addresses the retrieval layer rather than adding more providers.\n\n### Semantic query planning\n\n- Adds a bounded game-development concept planner for turret/cannon/artillery/tank, tower-defense/fortification, weapons, enemies, vehicles, characters, low-poly, UI/audio and gameplay systems.\n- `find_game_assets` tries the original query first, then semantic/broader variants only when the relevant result set is shallow.\n- Explicit dimensions, engine constraints, commercial-use, attribution/share-alike policy and reuse-scope filters are preserved through fallback.\n- Results must have lexical or semantic query relevance; license/popularity metadata alone cannot make an unrelated asset pass.\n\n### Zero-result diagnostics and provider capabilities\n\n- Unified search reports attempted queries, fallback level/reason, cumulative relevant results and suggested alternatives.\n- Adds a provider capability matrix for dimensions, engine scope and strengths.\n- Search prunes providers that cannot satisfy explicit dimension/engine constraints before making live calls.\n- `list_asset_providers` exposes the same capability metadata to MCP clients.\n\n### Niche engine discovery\n\n- Adds explicit UrhoX/Urho3D/TapMaker, LÖVE/Love2D and Defold engine recognition.\n- GitHub Code detects these ecosystems and uses normalized search aliases (for example UrhoX -> Urho3D search terminology).\n- `find_reusable_projects` now includes license-screened GitHub Code discovery in addition to maintained starter catalogs.\n- Live GitHub discoveries are conservatively `code-only / needs-review`; they are not represented as maintained verified starters.\n\n### Compact recommendation UX\n\n- `recommend_stack` now defaults to `responseMode = summary`.\n- Summary mode keeps the primary/alternatives, source, provider, license/risk, score and reuse status but omits verbose raw metadata.\n- `responseMode = full` preserves the detailed response for audits and advanced agents.\n\n### Real regression coverage\n\nThe test suite includes the real failure query `tower defense turret gun enemy 3D low poly` with an explicit 3D constraint. The search must use semantic fallback to recover relevant 3D candidates when available and must never use the 2D Tower Defense/Pixel Platformer packs to satisfy that 3D request.\n\n### Release engineering\n\n- package/runtime/lockfile version: `1.15.0`;\n- Node 20/22 validation, npm tarball clean-install and MCP binary smoke start remain required;\n- search quality rules are documented in `docs/search-quality.md`.\n\n### Compatibility\n\nV1.15 is additive at the provider/license layer. `recommend_stack` changes its MCP default presentation to compact summary; callers that require the prior verbose shape can request `responseMode = full`.\n\n---\n\n\n'''
          if not current.startswith('# Release notes\n\n## v1.15.0'):
              current = current.replace('# Release notes\n\n', '# Release notes\n\n' + section, 1)
          notes.write_text(current)
          PY
      - name: Commit and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json README.md RELEASE_NOTES.md
          git rm .github/workflows/finalize-v1150.yml
          git commit -m "Finalize v1.15 search-quality release files"
          git push origin HEAD:agent/search-quality-v1150
