name: Finalize v1.13 documentation

on:
  push:
    branches: [agent/full-benchmark-v1130]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-benchmark-v1130
      - name: Update release and benchmark docs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          notes = Path('RELEASE_NOTES.md')
          current = notes.read_text()
          section = '''## v1.13.0\n\nV1.13 hardens the 39-scenario full coverage benchmark and improves recommendation depth without weakening license filters.\n\n### Full-suite reliability\n\n- GitHub Code now reads Search rate-limit headers and waits for an explicit reset window when `remaining=0` or `Retry-After` is present.\n- Rate-limit waiting is bounded; the provider does not spin on unrestricted retries.\n- A safer reset padding and bounded retry path remove the remaining full-suite Search-window edge errors.\n\n### Recommendation depth\n\n- `recommend_stack` no longer stops after the first fallback query that returns only one candidate.\n- It preserves the first/specific query result as primary, then continues broader fallbacks only until `perSlotLimit` is filled.\n- Candidates are deduplicated by provider + resource ID.\n- This improves real choice depth without changing commercial-use, attribution, share-alike or unknown-license policy.\n\n### Full 39-scenario benchmark\n\nA timestamped full live run on 2026-08-20 completed with:\n\n- 39/39 complete scenarios;\n- 357/357 required slots covered (100%);\n- 353/357 required slots with at least three candidates (98.9% depth-3);\n- 0 unsupported required slots;\n- 0 provider errors.\n\nAll required slot categories except `starter` reached 100% depth-3. Starter depth-3 was 85.7% (24/28), with the remaining four shallow occurrences concentrated in Unreal scenarios.\n\nThe project deliberately did **not** add a third Unreal starter merely to obtain a 100% benchmark score. A reviewed candidate exists under CC0, while the current `communitystarters` provider uses a uniform MIT license profile; adding that candidate without first supporting per-entry license profiles would misclassify its license.\n\n### Measurement integrity\n\nThe 98.9% result is retained as the honest V1.13 full-suite snapshot. Benchmark depth is not permission to broaden rights, relabel licenses or hide shallow categories.\n\n### Release engineering\n\n- package/runtime/lockfile version: `1.13.0`;\n- deterministic tests cover rate-limit delay semantics and fallback depth accumulation;\n- Node 20/22 validation, npm tarball clean-install and MCP binary smoke start remain required.\n\n### Compatibility\n\nV1.13 is additive. Existing provider IDs, adoption rules, safe-install allowlists and attribution workflows remain unchanged.\n\n---\n\n\n'''
          if not current.startswith('# Release notes\n\n## v1.13.0'):
              current = current.replace('# Release notes\n\n', '# Release notes\n\n' + section, 1)
          notes.write_text(current)

          coverage = Path('docs/coverage-benchmark.md')
          text = coverage.read_text().rstrip()
          section = '''\n\n## V1.13 full-suite snapshot\n\nV1.13 ran the complete 39-scenario suite after adding rate-aware GitHub Search pacing and fallback depth filling. The timestamped live result on 2026-08-20 was:\n\n```text\nscenarios                  39/39 complete\nrequired-slot coverage     357/357 = 100%\ndepth-3 coverage           353/357 = 98.9%\nunsupported required slots 0\nprovider errors            0\n```\n\nGroup depth-3 coverage was 100% for generic, Godot, Phaser, Raylib and Unity, and 89.2% for Unreal. Every required slot category except `starter` reached 100% depth-3. Starter depth-3 was 85.7% (24/28).\n\nThe remaining four shallow starter occurrences are not hidden or reclassified. Unreal currently has two maintained verified community starters in the uniform-MIT catalog. A third reviewed Unreal template uses CC0; the catalog must first support per-entry license profiles before that differently licensed candidate can be added accurately.\n\nThis snapshot demonstrates retrieval depth under the maintained 39 scenarios at one point in time. It is not a permanent guarantee that live upstream indexes or APIs will return identical results in future runs.\n'''
          if '## V1.13 full-suite snapshot' not in text:
              text += section
          coverage.write_text(text + '\n')

          readme = Path('README.md')
          text = readme.read_text()
          needle = 'Benchmark scores never override or relax license rules. In the V1.12 live 12-scenario smoke snapshot (2026-08-20), required-slot coverage reached 100%, depth-3 coverage 85.7%, all 12 scenarios were complete, unsupported required slots were 0 and provider errors were 0. This is a smoke snapshot, not a claim that the 39-scenario full suite is perfect. See [`docs/coverage-benchmark.md`](docs/coverage-benchmark.md).'
          replacement = 'Benchmark scores never override or relax license rules. In the V1.13 timestamped 39-scenario full run (2026-08-20), required-slot coverage was 100%, depth-3 coverage 98.9%, all 39 scenarios were complete, unsupported required slots were 0 and provider errors were 0. The only shallow required category was Unreal starter depth; the project intentionally did not misclassify a differently licensed candidate merely to obtain a 100% score. See [`docs/coverage-benchmark.md`](docs/coverage-benchmark.md).'
          if needle in text:
              text = text.replace(needle, replacement, 1)
          readme.write_text(text)
          PY
      - name: Commit docs and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md RELEASE_NOTES.md docs/coverage-benchmark.md
          git rm .github/workflows/finalize-docs-v1130.yml
          git commit -m "Document v1.13 full-suite coverage"
          git push origin HEAD:agent/full-benchmark-v1130
