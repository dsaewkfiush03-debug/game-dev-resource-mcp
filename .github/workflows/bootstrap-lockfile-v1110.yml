name: Bootstrap lockfile v1.11.0

on:
  push:
    branches: [agent/coverage-benchmark-v1110]

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/coverage-benchmark-v1110
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit refreshed lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- package-lock.json; then
            git add -- package-lock.json
            git commit -m "Refresh npm lockfile for 1.11.0"
          fi
          git rm .github/workflows/bootstrap-lockfile-v1110.yml
          git commit -m "Remove temporary v1.11 lockfile workflow"
          git push origin HEAD:agent/coverage-benchmark-v1110
