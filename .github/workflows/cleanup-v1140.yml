name: Cleanup v1.14 validation marker

on:
  pull_request:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mixed-license-catalog-v1140
      - name: Remove temporary validation files
        shell: bash
        run: |
          set -euo pipefail
          test -f validation-v1140.txt
          grep -q 'release validation passed' validation-v1140.txt
          grep -q 'validate=success' validation-v1140.txt
          grep -q 'package-smoke=success' validation-v1140.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm validation-v1140.txt .github/workflows/cleanup-v1140.yml
          git commit -m "Remove temporary v1.14 validation marker"
          git push origin HEAD:agent/mixed-license-catalog-v1140
