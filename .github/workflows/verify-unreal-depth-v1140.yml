name: Verify Unreal depth v1.14

on:
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mixed-license-catalog-v1140
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Run Unreal benchmark group
        shell: bash
        run: |
          npx tsx -e 'import { writeFileSync } from "node:fs"; import { runCoverageBenchmark } from "./src/coverage.ts"; (async()=>{const r=await runCoverageBenchmark({suite:"full",groups:["unreal"],perSlotLimit:3,concurrency:2});const out={generatedAt:r.generatedAt,scenarioCount:r.scenarioCount,requiredSlots:r.requiredSlots,coveredRequiredSlots:r.coveredRequiredSlots,requiredSlotCoveragePercent:r.requiredSlotCoveragePercent,depth3RequiredSlots:r.depth3RequiredSlots,depth3CoveragePercent:r.depth3CoveragePercent,completeScenarios:r.completeScenarios,completeScenarioPercent:r.completeScenarioPercent,unsupportedRequiredSlots:r.unsupportedRequiredSlots,providerErrorCount:r.providerErrorCount,providerErrors:r.providerErrors,weakSlots:r.weakSlots,groupMetrics:r.groupMetrics};writeFileSync("unreal-depth-v1140.json",JSON.stringify(out,null,2));console.log("UNREAL_DEPTH="+JSON.stringify(out));})().catch(e=>{console.error(e);process.exit(1);});'
      - name: Commit result and remove workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f unreal-depth-v1140.json ]; then git add unreal-depth-v1140.json; fi
          git rm .github/workflows/verify-unreal-depth-v1140.yml
          git commit -m "Capture temporary Unreal depth verification"
          git push origin HEAD:agent/mixed-license-catalog-v1140
