name: Bootstrap lockfile v1.14.0

on:
  push:
    branches: [agent/mixed-license-catalog-v1140]

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mixed-license-catalog-v1140
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/bootstrap-lockfile-v1140.yml
          git commit -m "Refresh npm lockfile for 1.14.0"
          git push origin HEAD:agent/mixed-license-catalog-v1140
