name: Refresh v1.16 lockfile

on:
  push:
    branches: [agent/search-quality-v1160]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/search-quality-v1160
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh package-lock through npm
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/refresh-lock-v1160.yml
          git commit -m "Refresh v1.16.0 package lockfile"
          git push origin HEAD:agent/search-quality-v1160
