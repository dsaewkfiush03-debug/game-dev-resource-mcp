name: Rerun full coverage benchmark v1.13

on:
  pull_request:

permissions:
  contents: write

jobs:
  benchmark:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-benchmark-v1130
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Run rate-aware full benchmark
        shell: bash
        run: |
          npx tsx -e 'import { writeFileSync } from "node:fs"; import { runCoverageBenchmark } from "./src/coverage.ts"; (async()=>{const r=await runCoverageBenchmark({suite:"full",perSlotLimit:3,concurrency:2});const out={generatedAt:r.generatedAt,scenarioCount:r.scenarioCount,requiredSlots:r.requiredSlots,coveredRequiredSlots:r.coveredRequiredSlots,requiredSlotCoveragePercent:r.requiredSlotCoveragePercent,depth3RequiredSlots:r.depth3RequiredSlots,depth3CoveragePercent:r.depth3CoveragePercent,completeScenarios:r.completeScenarios,completeScenarioPercent:r.completeScenarioPercent,unsupportedRequiredSlots:r.unsupportedRequiredSlots,providerErrorCount:r.providerErrorCount,providerErrors:r.providerErrors,weakSlots:r.weakSlots,groupMetrics:r.groupMetrics,slotMetrics:r.slotMetrics,scenarios:r.scenarios.map(s=>({id:s.id,label:s.label,group:s.group,coveragePercent:s.coveragePercent,depth3Percent:s.depth3Percent,gaps:s.gaps,weakSlots:s.weakSlots,providerErrorCount:s.providerErrorCount}))};writeFileSync("coverage-full-clean-v1130.json",JSON.stringify(out,null,2));console.log("FULL_CLEAN="+JSON.stringify({requiredSlotCoveragePercent:r.requiredSlotCoveragePercent,depth3CoveragePercent:r.depth3CoveragePercent,completeScenarioPercent:r.completeScenarioPercent,unsupportedRequiredSlots:r.unsupportedRequiredSlots,providerErrorCount:r.providerErrorCount,weakSlots:r.weakSlots,groupMetrics:r.groupMetrics}));})().catch(e=>{console.error(e);process.exit(1);});'
      - name: Commit result and remove workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f coverage-full-clean-v1130.json ]; then git add -- coverage-full-clean-v1130.json; fi
          git rm .github/workflows/rerun-full-benchmark-v1130.yml
          git commit -m "Capture temporary clean v1.13 full benchmark"
          git push origin HEAD:agent/full-benchmark-v1130
