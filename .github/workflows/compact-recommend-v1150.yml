name: Add compact v1.15 recommendation response

on:
  push:
    branches: [agent/search-quality-v1150]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/search-quality-v1150
      - name: Patch recommend_stack MCP response
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/index.ts')
          text = p.read_text()
          old = '''    allowShareAlike: z.boolean().default(false),\n    perSlotLimit: z.number().int().min(1).max(10).default(3)\n  })\n}, async options => text(await recommendStack(options)));'''
          new = '''    allowShareAlike: z.boolean().default(false),\n    perSlotLimit: z.number().int().min(1).max(10).default(3),\n    responseMode: z.enum(["summary", "full"]).default("summary")\n  })\n}, async options => {\n  const { responseMode, ...recommendOptions } = options;\n  const result = await recommendStack(recommendOptions);\n  if (responseMode === "full") return text(result);\n  const compactAsset = (asset: any) => asset ? ({\n    id: asset.id, name: asset.name, provider: asset.provider, sourceUrl: asset.sourceUrl,\n    license: asset.license, licenseRisk: asset.licenseRisk, score: asset.score,\n    dimension: asset.dimension, style: asset.style, formats: asset.formats,\n    reuseScope: asset.reuseScope, bundledAssetStatus: asset.bundledAssetStatus\n  }) : undefined;\n  return text({\n    responseMode: "summary",\n    inferred: result.inferred,\n    complete: result.complete,\n    requiredGaps: result.requiredGaps,\n    slots: result.recommendations.map(item => ({\n      slot: item.slot.id,\n      label: item.slot.label,\n      required: item.slot.required,\n      status: item.primary ? "matched" : "gap",\n      queryUsed: item.queryUsed,\n      primary: compactAsset(item.primary),\n      alternatives: item.alternatives.map(compactAsset),\n      gap: item.gap,\n      providerErrorCount: item.providerErrors.length\n    })),\n    licenseSummary: result.licenseSummary,\n    notes: [\n      "Summary mode omits verbose per-asset metadata. Request responseMode=full only when detailed provenance/ranking data is needed.",\n      ...result.notes.slice(0, 3)\n    ]\n  });\n});'''
          assert old in text
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Commit and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.ts
          git rm .github/workflows/compact-recommend-v1150.yml
          git commit -m "Add compact recommendation response mode"
          git push origin HEAD:agent/search-quality-v1150
