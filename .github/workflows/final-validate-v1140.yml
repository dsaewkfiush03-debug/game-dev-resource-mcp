name: Final validate v1.14

on:
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mixed-license-catalog-v1140
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run validate
      - name: Pack and install into clean project
        shell: bash
        run: |
          set -euo pipefail
          PACK_FILE="$(npm pack --silent)"
          EXPECTED_VERSION="$(node -p "require('$GITHUB_WORKSPACE/package.json').version")"
          rm -rf /tmp/game-dev-resource-mcp-v114-smoke
          mkdir -p /tmp/game-dev-resource-mcp-v114-smoke
          cd /tmp/game-dev-resource-mcp-v114-smoke
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE/$PACK_FILE"
          ACTUAL_VERSION="$(node -p "require('./node_modules/game-dev-resource-mcp/package.json').version")"
          test "$ACTUAL_VERSION" = "$EXPECTED_VERSION"
          set +e
          timeout 2s ./node_modules/.bin/game-dev-resource-mcp </dev/null
          CODE=$?
          set -e
          if [ "$CODE" -ne 0 ] && [ "$CODE" -ne 124 ]; then exit "$CODE"; fi
      - name: Commit validation marker and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          printf 'v1.14.0 release validation passed\nnode=22\nvalidate=success\npackage-smoke=success\n' > validation-v1140.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation-v1140.txt
          git rm .github/workflows/final-validate-v1140.yml
          git commit -m "Record temporary v1.14 release validation"
          git push origin HEAD:agent/mixed-license-catalog-v1140
