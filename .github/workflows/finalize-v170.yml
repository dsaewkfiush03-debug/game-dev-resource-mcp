name: Finalize v1.7.0

on:
  push:
    branches: [agent/kenney-verification-v170]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/kenney-verification-v170
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ensure final v1.7 code state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path('package.json')
          package = json.loads(p.read_text())
          package['version'] = '1.7.0'
          test = package['scripts']['test']
          for item in ['src/providers/v17.test.ts', 'src/verification.test.ts']:
              if item not in test:
                  test = test.replace(' src/version.test.ts', f' {item} src/version.test.ts')
          package['scripts']['test'] = test
          p.write_text(json.dumps(package, indent=2) + '\n')
          Path('src/version.ts').write_text('export const VERSION = "1.7.0";\n')

          idx = Path('src/index.ts')
          text = idx.read_text()
          vimport = 'import { assessVerification, summarizeVerification } from "./verification.js";\n'
          if vimport not in text:
              text = text.replace('import { VERSION } from "./version.js";\n', 'import { VERSION } from "./version.js";\n' + vimport)
          audit = '''\nserver.registerTool("audit_resource_verification", {\n  description: "Audit verification freshness for maintained verified catalogs. Reports current, stale, needs-review and untracked entries without changing license rights.",\n  inputSchema: z.object({\n    staleAfterDays: z.number().int().min(1).max(3650).default(365),\n    providers: z.array(providerId).optional()\n  })\n}, async ({ staleAfterDays, providers }) => {\n  const catalogs = listProviders().filter(provider => provider.mode === "verified-catalog");\n  const selected = providers?.length ? catalogs.filter(provider => providers.includes(provider.id)) : catalogs;\n  const allItems = [];\n  const providerAudits = [];\n  for (const meta of selected) {\n    const assets = await getProvider(meta.id).search({ query: "", limit: 100 });\n    const items = assets.map(asset => assessVerification(asset, staleAfterDays));\n    allItems.push(...items);\n    providerAudits.push({ provider: meta.id, name: meta.name, count: items.length, summary: summarizeVerification(items) });\n  }\n  const attention = allItems.filter(item => item.assessment !== "current");\n  return text({ staleAfterDays, providerCount: selected.length, assetCount: allItems.length, summary: summarizeVerification(allItems), providers: providerAudits, attention });\n});\n'''
          if 'server.registerTool("audit_resource_verification"' not in text:
              marker = '\nserver.registerTool("search_open_source_projects", {'
              if marker not in text:
                  raise SystemExit('index insertion marker missing')
              text = text.replace(marker, audit + marker)
          idx.write_text(text)
          PY
      - name: Refresh lockfile and validate
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm run validate
      - name: Remove temporary workflows and commit final state
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/bootstrap-v170.yml .github/workflows/docs-v170.yml .github/workflows/finalize-v170.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No finalization changes required"
            exit 0
          fi
          git commit -m "Finalize and validate v1.7.0"
          git push origin HEAD:agent/kenney-verification-v170
