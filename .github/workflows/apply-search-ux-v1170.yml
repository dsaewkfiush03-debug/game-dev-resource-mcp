name: Apply v1.17 search UX integration

on:
  push:
    branches: [agent/search-ux-v1170]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/search-ux-v1170
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch MCP UX and release files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/tool-schemas.ts')
          s = p.read_text()
          old = '''  limit: z.number().int().min(1).max(100).default(20).describe("Maximum number of ranked results returned after cross-provider filtering and ranking."),
  perProviderLimit: z.number().int().min(1).max(100).default(50).describe("Maximum candidates requested from each provider before global filtering/ranking. Raise only when broader provider recall is needed.")
});'''
          new = '''  limit: z.number().int().min(1).max(100).default(10).describe("Page size for ranked results. Defaults to 10 to keep agent context compact."),
  offset: z.number().int().min(0).max(99).default(0).describe("Zero-based result offset for pagination. Use pagination.nextOffset from the previous response."),
  responseMode: z.enum(["summary", "full"]).default("summary").describe("summary returns compact agent-friendly fields and match reasons; full includes complete provider metadata."),
  perProviderLimit: z.number().int().min(1).max(100).default(50).describe("Maximum candidates requested from each provider before global filtering/ranking. Raise only when broader provider recall is needed.")
});'''
          if old not in s:
              raise SystemExit('findGameAssets schema anchor not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('src/index.ts')
          s = p.read_text()
          anchor = 'import { searchAllAssets } from "./search.js";\n'
          if 'searchAssetsPage' not in s:
              s = s.replace(anchor, anchor + 'import { searchAssetsPage } from "./search-ux.js";\n', 1)
          old = '''}, async options => text({ query: options.query, ...(await searchAllAssets(options)), filters: { commercialOnly: options.commercialOnly, allowAttribution: options.allowAttribution, allowShareAlike: options.allowShareAlike, engines: options.engines, dimensions: options.dimensions, styles: options.styles, formats: options.formats, assetTypes: options.assetTypes, gameGenres: options.gameGenres, reuseScopes: options.reuseScopes, bundledAssetStatuses: options.bundledAssetStatuses, animated: options.animated } }));'''
          new = '''}, async options => {
  const page = await searchAssetsPage(options);
  return text({
    query: options.query,
    ...page,
    filters: {
      commercialOnly: options.commercialOnly,
      allowAttribution: options.allowAttribution,
      allowShareAlike: options.allowShareAlike,
      engines: options.engines,
      dimensions: options.dimensions,
      styles: options.styles,
      formats: options.formats,
      assetTypes: options.assetTypes,
      gameGenres: options.gameGenres,
      reuseScopes: options.reuseScopes,
      bundledAssetStatuses: options.bundledAssetStatuses,
      animated: options.animated
    }
  });
});'''
          if old not in s:
              raise SystemExit('find_game_assets handler anchor not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('package.json')
          s = p.read_text().replace('"version": "1.16.0"', '"version": "1.17.0"', 1)
          s = s.replace('src/search.test.ts src/install.test.ts', 'src/search.test.ts src/search-ux.test.ts src/install.test.ts', 1)
          p.write_text(s)

          Path('src/version.ts').write_text('export const VERSION = "1.17.0";\n')

          p = Path('README.md')
          s = p.read_text()
          needle = '- Search multiple game-resource providers with one query.\n'
          repl = '''- Search multiple game-resource providers with one query.\n- Keep `find_game_assets` compact by default, with `responseMode=full` available for audits.\n- Page large result sets with `offset` + `limit` and use `pagination.nextOffset` to continue.\n- Reuse identical cross-provider searches from a short process-local cache to reduce repeated provider/API calls.\n'''
          if needle in s and 'pagination.nextOffset' not in s:
              s = s.replace(needle, repl, 1)
          p.write_text(s)

          p = Path('RELEASE_NOTES.md')
          s = p.read_text()
          section = '''## v1.17.0\n\nV1.17 keeps the project focused on search-engine usability for AI coding agents.\n\n### Compact direct search\n\n- `find_game_assets` now defaults to `responseMode=summary` instead of returning every provider field.\n- Summary results retain ID/name/provider/source URL, license/risk, score, dimension/style/formats/types and the most useful lexical/semantic match reasons.\n- `responseMode=full` remains available when an agent needs complete provider provenance and ranking metadata.\n\n### Pagination\n\n- Adds zero-based `offset` plus page-sized `limit` to `find_game_assets`.\n- Responses include `pagination.returned`, `hasMore` and `nextOffset`.\n- The response layer asks the underlying semantic search for enough relevant candidates to satisfy the requested page instead of stopping at the ordinary shallow fallback target.\n\n### Repeated-search cache\n\n- Adds a bounded five-minute process-local cache for identical cross-provider page searches.\n- Diagnostics expose `cache.hit` and the cache TTL.\n- The cache stores search results only in the running MCP process; it writes no user data or telemetry to disk.\n\n### Product boundary\n\nNo engine import/conversion layer was added. V1.17 remains a game-resource search-engine UX release.\n\n### Release engineering\n\n- package/runtime/lockfile version: `1.17.0`;\n- deterministic tests cover compact output, pagination and repeat-query cache hits;\n- Node 20/22 validation and package-smoke remain required.\n\n---\n\n\n'''
          if not s.startswith('# Release notes\n\n## v1.17.0'):
              s = s.replace('# Release notes\n\n', '# Release notes\n\n' + section, 1)
          p.write_text(s)
          PY
          npm install --package-lock-only --ignore-scripts
      - name: Validate
        run: npm run validate
      - name: Commit and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/tool-schemas.ts src/index.ts src/version.ts package.json package-lock.json README.md RELEASE_NOTES.md
          git rm .github/workflows/apply-search-ux-v1170.yml
          git commit -m "Integrate v1.17 search UX"
          git push origin HEAD:agent/search-ux-v1170
