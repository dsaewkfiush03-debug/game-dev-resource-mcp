name: Bootstrap v1.7.0

on:
  push:
    branches: [agent/kenney-verification-v170]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/kenney-verification-v170
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update version test script and MCP audit tool
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          package['version'] = '1.7.0'
          test = package['scripts']['test']
          for item in ['src/providers/v17.test.ts', 'src/verification.test.ts']:
              if item not in test:
                  marker = ' src/version.test.ts'
                  test = test.replace(marker, f' {item}{marker}')
          package['scripts']['test'] = test
          package_path.write_text(json.dumps(package, indent=2) + '\n')

          Path('src/version.ts').write_text('export const VERSION = "1.7.0";\n')

          index_path = Path('src/index.ts')
          index = index_path.read_text()
          import_line = 'import { VERSION } from "./version.js";\n'
          verification_import = 'import { assessVerification, summarizeVerification } from "./verification.js";\n'
          if verification_import not in index:
              index = index.replace(import_line, import_line + verification_import)

          audit_tool = '''\nserver.registerTool("audit_resource_verification", {\n  description: "Audit verification freshness for maintained verified catalogs. Reports current, stale, needs-review and untracked entries without changing license rights.",\n  inputSchema: z.object({\n    staleAfterDays: z.number().int().min(1).max(3650).default(365),\n    providers: z.array(providerId).optional()\n  })\n}, async ({ staleAfterDays, providers }) => {\n  const catalogs = listProviders().filter(provider => provider.mode === "verified-catalog");\n  const selected = providers?.length ? catalogs.filter(provider => providers.includes(provider.id)) : catalogs;\n  const allItems = [];\n  const providerAudits = [];\n  for (const meta of selected) {\n    const assets = await getProvider(meta.id).search({ query: "", limit: 100 });\n    const items = assets.map(asset => assessVerification(asset, staleAfterDays));\n    allItems.push(...items);\n    providerAudits.push({ provider: meta.id, name: meta.name, count: items.length, summary: summarizeVerification(items) });\n  }\n  const attention = allItems.filter(item => item.assessment !== "current");\n  return text({\n    staleAfterDays,\n    providerCount: selected.length,\n    assetCount: allItems.length,\n    summary: summarizeVerification(allItems),\n    providers: providerAudits,\n    attention\n  });\n});\n'''
          marker = '\nserver.registerTool("search_open_source_projects", {'
          if 'server.registerTool("audit_resource_verification"' not in index:
              if marker not in index:
                  raise SystemExit('Could not find insertion marker in src/index.ts')
              index = index.replace(marker, audit_tool + marker)
          index_path.write_text(index)
          PY
      - name: Refresh npm lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Remove bootstrap workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/bootstrap-v170.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/version.ts src/index.ts
          git commit -m "Finalize v1.7.0 verification audit tooling"
          git push origin HEAD:agent/kenney-verification-v170
