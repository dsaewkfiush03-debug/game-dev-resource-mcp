name: Measure full depth benchmark v1.13

on:
  push:
    branches: [agent/full-benchmark-v1130]
  pull_request:

permissions:
  contents: write

jobs:
  benchmark:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-benchmark-v1130
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Run 39-scenario depth benchmark
        shell: bash
        run: |
          npx tsx -e 'import { writeFileSync } from "node:fs"; import { runCoverageBenchmark } from "./src/coverage.ts"; (async()=>{const r=await runCoverageBenchmark({suite:"full",perSlotLimit:3,concurrency:2});const out={generatedAt:r.generatedAt,scenarioCount:r.scenarioCount,requiredSlots:r.requiredSlots,coveredRequiredSlots:r.coveredRequiredSlots,requiredSlotCoveragePercent:r.requiredSlotCoveragePercent,depth3RequiredSlots:r.depth3RequiredSlots,depth3CoveragePercent:r.depth3CoveragePercent,completeScenarios:r.completeScenarios,completeScenarioPercent:r.completeScenarioPercent,unsupportedRequiredSlots:r.unsupportedRequiredSlots,providerErrorCount:r.providerErrorCount,providerErrors:r.providerErrors,weakSlots:r.weakSlots,groupMetrics:r.groupMetrics,slotMetrics:r.slotMetrics};writeFileSync("coverage-full-depth-v1130.json",JSON.stringify(out,null,2));console.log("FULL_DEPTH="+JSON.stringify(out));})().catch(e=>{console.error(e);process.exit(1);});'
      - name: Commit result and remove workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f coverage-full-depth-v1130.json ]; then git add -- coverage-full-depth-v1130.json; fi
          git rm .github/workflows/measure-depth-v1130.yml
          git commit -m "Capture temporary v1.13 depth benchmark"
          git push origin HEAD:agent/full-benchmark-v1130
